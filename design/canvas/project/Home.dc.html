<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host or join</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.gb{font-family:'Press Start 2P',monospace;color:#181818;background:#F8F8F8;-webkit-font-smoothing:none}
.gb p,.gb h1,.gb h2{margin:0;font-weight:400}
.frame{border:6px solid #181818;background-color:#F8F8F8}
.pix{image-rendering:pixelated;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.cur{flex:none;visibility:hidden}
a.btn{color:inherit;text-decoration:none}
.lbl{display:block;font-size:16px;line-height:32px;color:#585858}
.field{display:block;width:100%;height:84px;box-sizing:border-box;padding:0 24px;font:inherit;font-size:24px;color:#181818;text-transform:uppercase;background:#F8F8F8;border:6px solid #181818;;outline:none}
.field::placeholder{color:#A8A8A8}
.field:focus{background-color:#E8E8E8}
.field.code{width:240px;font-size:32px;letter-spacing:16px;text-align:center;padding:0 0 0 16px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;width:240px;box-sizing:border-box;padding:36px 24px;font-size:24px;border:6px solid #181818}
.btn .cur{position:absolute;left:30px;top:50%;margin-top:-12px}
.btn:hover .cur,.btn:focus-visible .cur{visibility:visible}
.btn:focus-visible{outline:none;background-color:#E8E8E8}
.btn.primary{background-color:#181818;color:#F8F8F8;--l:#F8F8F8;--e:#181818}
.btn.primary path{fill:#F8F8F8}
/* The trainer sprite's box is a link to Choose a Trainer: the ▶ cursor and a grey fill on hover/focus, like a button */
.pick{position:relative;display:flex;align-items:center;justify-content:center;width:240px;height:204px;box-sizing:border-box;color:inherit;text-decoration:none}
.pick .cur{position:absolute;left:9px;top:50%;margin-top:-12px}
.pick:hover .cur,.pick:focus-visible .cur{visibility:visible}
.pick:hover,.pick:focus-visible{outline:none;background-color:#E8E8E8}
.radio{display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px;cursor:pointer}
.radio input{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;box-sizing:border-box;border:3px solid #181818;background:#F8F8F8;cursor:pointer}
.radio input:checked{background:#181818;box-shadow:inset 0 0 0 3px #F8F8F8}
.radio input:focus-visible{outline:3px solid #181818;outline-offset:3px}
/* Pixel corners: two 3px steps off the outer edge, a 3px square rounding the thick line's inner edge, one step off the thin line */
.frame,.field,.btn{--l:#181818;--e:var(--l);background-image:linear-gradient(var(--l),var(--l)),linear-gradient(var(--l),var(--l)),linear-gradient(var(--l),var(--l)),linear-gradient(var(--l),var(--l)),linear-gradient(var(--e),var(--e)),linear-gradient(var(--e),var(--e)),linear-gradient(var(--e),var(--e)),linear-gradient(var(--e),var(--e));background-position:left 6px top 3px,left 6px bottom 3px,left 3px top 6px,right 3px top 6px,left top,right top,left bottom,right bottom;background-size:calc(100% - 12px) 3px,calc(100% - 12px) 3px,3px calc(100% - 12px),3px calc(100% - 12px),3px 3px,3px 3px,3px 3px,3px 3px;background-repeat:no-repeat}
.frame,.field,.btn{clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px)}
</style>
</helmet>
<div class="gb" style="width: 1200px; height: 900px; box-sizing: border-box; padding: 48px 72px; display: flex; flex-direction: column; align-items: center; gap: 36px">
  <div style="display: flex; align-items: center; gap: 24px">
    <img class="pix" src="/_blob/fb383c33e038829411911e9eeb755646" alt="" style="width: 64px; height: 64px">
    <h1 style="font-size: 40px; line-height: 48px">PICOMON STADIUM</h1>
    <img class="pix" src="/_blob/fb383c33e038829411911e9eeb755646" alt="" style="width: 64px; height: 64px">
  </div>
  <!-- The NAME field (.field) is kept in the styles but no longer used: your trainer's name is your player name -->
  <form class="frame" onSubmit="{{submit}}" style="align-self: stretch; box-sizing: border-box; padding: 30px 42px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 48px">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div>
          <p class="lbl">NEW ROOM</p>
          <p style="font-size: 16px; line-height: 26px">Host a room and share its code.</p>
        </div>
        <button type="button" class="btn primary" onClick="{{host}}">
          <svg class="cur" width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="#181818"></path></svg>
          HOST
        </button>
        <!-- Battle size and draft type are set in the waiting room -->
      </div>
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div>
          <label class="lbl" for="home-code">ROOM CODE</label>
          <input id="home-code" class="field code" value="{{code}}" onChange="{{setCode}}" maxlength="4" placeholder="----" autocomplete="off">
        </div>
        <button type="submit" class="btn">
          <svg class="cur" width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="#181818"></path></svg>
          JOIN
        </button>
        <!-- RULES is in the waiting room -->
      </div>
      <section aria-label="Your trainer">
        <p class="lbl">TRAINER</p>
        <p style="font-size: 24px; line-height: 32px; margin-bottom: 12px">{{trainer.name}}</p>
        <!-- The sprite is the button: it opens Choose a Trainer -->
        <a class="frame pick" href="Trainers.dc.html" aria-label="Change trainer ({{trainer.name}})">
          <svg class="cur" width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="#181818"></path></svg>
          <img class="pix" src="{{trainer.src}}" alt="" style="width: 168px; height: 168px">
        </a>
      </section>
    </div>
  </form>
  <div class="frame" role="status" style="align-self: stretch; padding: 30px 42px; display: flex; flex-direction: column; justify-content: center; min-height: 168px; box-sizing: border-box">
    <p style="font-size: 24px; line-height: 48px">{{msg1}}</p>
    <p style="font-size: 24px; line-height: 48px">{{msg2}}</p>
  </div>
  <a href="Lobby.dc.html" ref="{{setGoHost}}" hidden aria-hidden="true" tabindex="-1"></a>
  <a href="LobbyFull.dc.html" ref="{{setGoJoin}}" hidden aria-hidden="true" tabindex="-1"></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"error":{"editor":"text","default":""},"code":{"editor":"text","default":""},"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Your trainer: the one you picked on Choose a Trainer, or a random one the first
    // time (prototype only, via localStorage; the app keeps it with the player)
    let trainer = null;
    try { trainer = localStorage.getItem('picomon.trainer'); } catch (e) {}
    this.state = { code: props.code || '', error: props.error || '', trainer };
  }
  renderVals() {
    // public/sprites/trainers: [file name, blob id]. The name is the file name in title case.
    // Order: Gold, Kris, Silver; Johto gym leaders; Johto Elite Four and champion;
    // Kanto gym leaders (as in Gold/Silver); Red; the rest of Kanto's Elite Four; Giovanni
    const TRAINERS = [
      ['gold', '7f637d61cab3e8387ee08d8d25e9aaff'],
      ['kris', 'c76b836c1bfafdbd78deeff9250a2095'],
      ['silver', '8dd7d340721b49346e7d79dd082fbf28'],
      ['falkner', '3633e800b02d55550e59ce2c19661332'],
      ['bugsy', '2c34c60ea3b7d0e560ecee5f8882649c'],
      ['whitney', '3f1d1e51f188d576cdf6ff213244de92'],
      ['morty', '31c7c66349950053d289e7009b0cef41'],
      ['chuck', 'ef6a283f9174874dcefcfd29675ab0e8'],
      ['jasmine', 'ab587a0fea49e1e45d255933a2a9b20f'],
      ['pryce', '57019ed49172f8938e4e86b36b6d4563'],
      ['clair', 'eec8625311a09aa930d1723b3599577a'],
      ['will', 'bcb5249fab074b00df80918074911aab'],
      ['koga', '3136d5c922788f1acc09f150aed31e3a'],
      ['bruno', '6631192fbea7e4aa039ca91b9cf07022'],
      ['karen', '849cce6ecd797a181b1a8e27a2d104f8'],
      ['lance', 'b295f6a618643524a9cff8a444cd7bac'],
      ['brock', '274e0824a621ddde57e070372450a1c9'],
      ['misty', '652b71cb448e2cac7967510c0f3e536e'],
      ['lt_surge', 'c4df8e31b8efae8697939eabb05b9f80'],
      ['erika', '7732cb788bc91f428fae8f78c4bc6760'],
      ['janine', '23d0dc64e78dd6952e8daff8be2f8c9a'],
      ['sabrina', '34326cb277f15d19c7b72abbc55ab960'],
      ['blaine', '71f4fc3456a69c5cffbe00e89a2f2f14'],
      ['blue', 'e3b1a84563374ad85508630487a1b2cb'],
      ['red', '54b041d4226b8eb651ebf309fb29c2ae'],
      ['lorelei', '98d1406c9bd7119af50f4d63130141ae'],
      ['agatha', 'fa3130ff22b78328859c618dbaeae44c'],
      ['giovanni', '18da1034643f5b00a284aab3d6bf6e40']
    ];
    const title = (key) => key.split('_').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
    let key = this.state.trainer;
    if (!TRAINERS.some(([k]) => k === key)) {
      key = TRAINERS[Math.floor(Math.random() * TRAINERS.length)][0];
      try { localStorage.setItem('picomon.trainer', key); } catch (e) {}
      this.state.trainer = key;
    }
    const trainer = { name: title(key), src: '/_blob/' + TRAINERS.find(([k]) => k === key)[1] };
    const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    const { code, error } = this.state;
    const fail = (e) => this.setState({ error: e });
    const host = () => {
      this.setState({ error: '' });
      if (this.goHost) this.goHost.click();
    };
    const submit = (e) => {
      e.preventDefault();
      const c = code.trim().toUpperCase();
      if (c.length !== 4) return fail('code');
      if (![...c].every((ch) => ALPHABET.includes(ch))) return fail('not-found');
      this.setState({ error: '' });
      if (this.goJoin) this.goJoin.click();
    };

    const MSG = {
      '': ['Host a room, or enter a', 'room code to join one.'],
      code: ['Enter a 4-character', 'room code.'],
      'not-found': ['Room not found.', 'Check the code and try again.']
    };
    const [msg1, msg2] = MSG[error] || MSG[''];

    return {
      code, msg1, msg2, host, submit, trainer,
      setCode: (e) => this.setState({ code: e.target.value.toUpperCase() }),
      setGoHost: (el) => { this.goHost = el; },
      setGoJoin: (el) => { this.goJoin = el; }
    };
  }
}
</script>
</body>
</html>
