<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waiting room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.gb{font-family:'Press Start 2P',monospace;color:#181818;background:#F8F8F8;-webkit-font-smoothing:none}
.gb p,.gb h1,.gb h2{margin:0;font-weight:400}
.frame{border:6px solid #181818;border-radius:6px;box-shadow:inset 0 0 0 3px #F8F8F8,inset 0 0 0 6px #181818;background:#F8F8F8}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.cur{flex:none;visibility:hidden}
.lbl{font-size:16px;line-height:32px;color:#585858}
.cell{width:96px;height:120px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:64px;padding-left:6px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;width:240px;box-sizing:border-box;padding:36px 24px;font-size:24px;border:6px solid #181818;border-radius:6px;box-shadow:inset 0 0 0 3px #F8F8F8,inset 0 0 0 6px #181818}
.btn .cur{position:absolute;left:30px;top:50%;margin-top:-12px}
.btn:hover .cur,.btn:focus-visible .cur{visibility:visible}
.btn:focus-visible{outline:none;background:#E8E8E8}
a.btn{color:inherit;text-decoration:none}
.btn.primary{background:#181818;color:#F8F8F8;box-shadow:inset 0 0 0 3px #181818,inset 0 0 0 6px #F8F8F8}
.btn.primary path{fill:#F8F8F8}
.prow{display:flex;align-items:center;gap:24px;height:48px;font-size:24px}
</style>
</helmet>
<div class="gb" style="width: 1200px; height: 900px; box-sizing: border-box; padding: 24px 72px; display: flex; flex-direction: column; gap: 18px">
  <h1 style="font-size: 32px; line-height: 48px; text-align: center">{{title}}</h1>
  <section class="frame" aria-label="Room code" style="padding: 30px 42px">
    <p class="lbl" style="margin-bottom: 12px">ROOM CODE</p>
    <div style="display: flex; align-items: center; gap: 12px">
      <sc-for list="{{chars}}" as="ch" hint-placeholder-count="4">
        <span class="frame cell">{{ch}}</span>
      </sc-for>
      <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
        <button type="button" class="btn" onClick="{{copy}}" style="margin-left: auto">
          <svg class="cur" width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="#181818"></path></svg>
          {{copyLabel}}
        </button>
      </sc-if>
    </div>
  </section>
  <section class="frame" aria-label="Players" style="padding: 30px 42px">
    <p class="lbl">PLAYERS</p>
    <div class="prow">
      <span style="color: #C03028; width: 48px">P1</span>
      <span style="flex: 1">{{host}}</span>
      <span style="font-size: 16px; color: #585858">HOST</span>
    </div>
    <div class="prow">
      <span style="color: #2860B8; width: 48px">P2</span>
      <sc-if value="{{full}}" hint-placeholder-val="{{ false }}">
        <span style="flex: 1">{{guest}}</span>
      </sc-if>
      <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
        <span style="flex: 1; color: #A8A8A8">- - - - - -</span>
      </sc-if>
    </div>
  </section>
  <div class="frame" role="status" style="padding: 30px 42px; display: flex; flex-direction: column; justify-content: center; min-height: 168px; box-sizing: border-box">
    <p style="font-size: 24px; line-height: 48px">{{msg1}}</p>
    <p style="font-size: 24px; line-height: 48px">{{msg2}}</p>
  </div>
  <sc-if value="{{full}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; justify-content: center">
      <a class="btn primary" href="Main.dc.html" style="width: 384px">
        <svg class="cur" width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="#181818"></path></svg>
        START BATTLE
      </a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"full":{"editor":"boolean","default":false},"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  componentWillUnmount() {
    clearTimeout(this.tc);
  }
  isFull() {
    return this.props.full === true || this.props.full === 'true';
  }
  renderVals() {
    const CODE = 'K7QM';
    const full = this.isFull();
    const copy = () => {
      if (navigator.clipboard) navigator.clipboard.writeText(CODE).catch(() => {});
      this.setState({ copied: true });
      clearTimeout(this.tc);
      this.tc = setTimeout(() => this.setState({ copied: false }), 1500);
    };
    return {
      title: full ? 'ROOM ' + CODE : 'WAITING ROOM',
      chars: CODE.split(''),
      full,
      waiting: !full,
      host: 'GOLD',
      guest: 'SILVER',
      copy,
      copyLabel: this.state.copied ? 'COPIED!' : 'COPY',
      msg1: full ? 'Both players connected!' : 'Send this code to a friend.',
      msg2: full ? 'Ready to battle?' : 'Waiting for PLAYER 2...'
    };
  }
}
</script>
</body>
</html>
