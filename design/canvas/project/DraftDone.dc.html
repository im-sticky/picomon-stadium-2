<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 900px">
  <dc-import name="Draft" p1picks="1,4,8,11,19,35" p2picks="3,32,16,22,27,30" hover="{{ hover }}" hint-size="1200px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { hover: 0 };
  }
}
</script>
</body>
</html>
