<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waiting room, guest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 900px">
  <dc-import name="Lobby" full="{{ full }}" guest="{{ guest }}" hint-size="1200px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { full: true, guest: true };
  }
}
</script>
</body>
</html>
